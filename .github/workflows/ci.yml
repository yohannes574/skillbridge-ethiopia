name: SkillBridge CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Client Code Quality (ESLint)
        run: npm run lint --prefix client

      - name: Client Unit & Integration Tests (Vitest)
        run: npm run test --prefix client

      - name: Server Integration Tests (Jest)
        run: npm run test --prefix server
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci

      - name: Client Production Build (Vite)
        run: npm run build --prefix client

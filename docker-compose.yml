version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:6-jammy
    container_name: skillbridge-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: skillbridge
    volumes:
      - mongo-data:/data/db

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillbridge-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/skillbridge
      JWT_SECRET: skillbridge_jwt_production_secret_key
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost
    depends_on:
      - mongo
    volumes:
      - server-uploads:/app/uploads

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillbridge-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
  server-uploads:
